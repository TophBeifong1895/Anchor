[package]
name = "anchor-devtools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native development entry points for bounded Anchor regression"

[dependencies]
anchor-distribution = { path = "../anchor-distribution" }
anchor-file-lease = { path = "../anchor-file-lease" }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = "3"
