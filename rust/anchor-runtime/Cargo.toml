[package]
name = "anchor-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Rust Graph runtime kernel for Anchor"

[features]
test-fixtures = ["dep:flate2"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
anchor-file-lease = { path = "../anchor-file-lease" }
anchor-kernel = { path = "../anchor-kernel" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
futures.workspace = true
tokio.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[dev-dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
tokio = { workspace = true, features = ["sync"] }
schemars = "1"
