[package]
name = "anchor-graph-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal in-process standalone host for Anchor Graph calls"

[dependencies]
anchor-runtime = { path = "../anchor-runtime" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
# Freezing a child Run's environments hashes published trees, so that step runs
# on a blocking worker rather than a runtime thread.
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
